<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEMANTIC SEARCH</title>
    <link rel="stylesheet" href="../static/styles.css">
    <script src="https://cdn.tailwindcss.com"></script>

</head>

<body data-bg="oddbird" class="h-screen">

    <!-- Hero Title Section -->
    <div class="max-w-7xl mx-auto py-12 px-4 sm:px-6 lg:px-8">
        <div class="text-center text-gray-700">
            <h1 class="text-4xl md:text-6xl font-bold leading-tight">IntelliSearch</h1>
            <p class="mt-2 text-lg md:text-xl">Search across Pdfs/Videos</p>
        </div>
    </div>

    <!-- Search Section -->
    <div class="flex items-center justify-center active" id="searchForm">
        <div class="w-full max-w-md">
            <form class="bg-gray-800 shadow-md rounded px-8 pt-6 pb-8 mb-4 border-4 border-pink-700 ">
                <h1 class="text-center font-bold text-2xl">
                    SEARCH FILES
                </h1>
                <br>

                <div class="mb-4">
                    <label class="block text-white text-sm font-bold mb-2" for="query">
                        Search Query
                    </label>
                    <input
                        class="shadow appearance-none border rounded w-full py-2 px-3 text-white bg-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                        id="query" type="text" placeholder="Enter your search query...">
                </div>
                <div class="mb-4">
                    <label class="block text-white text-sm font-bold mb-2" for="limit">
                        Result Limit
                    </label>
                    <input
                        class="shadow appearance-none border rounded w-full py-2 px-3 text-white bg-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                        id="limit" type="number" value="5" placeholder="Enter result limit...">
                </div>
                <div class="flex items-center justify-between">
                    <button
                        class="bg-transparent border border-blue-700 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline"
                        id='search' type="button">
                        <i class="fa-brands fa-searchengin"></i>
                        Search
                    </button>
                    <button
                        class="bg-transparent border border-green-500 hover:bg-green-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline"
                        id='toggleUploadFiles' type="button">
                        <i class="fa-solid fa-upload"></i>

                        Go to Upload
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- File Upload Section  -->

    <div class="flex items-center justify-center hidden" id="uploadForm">
        <div class="w-full max-w-md">
            <form class="bg-gray-800 shadow-md rounded px-8 pt-6 pb-8 mb-4 border-4 border-pink-700">
                <h1 class="text-center font-bold text-2xl">
                    UPLOAD FILES
                </h1>
                <br>
                <div class="z-0 max-w-md mx-auto rounded-lg overflow-hidden md:max-w-xl ">
                    <div class="md:flex">
                        <div class="w-full p-3">
                            <div
                                class="relative border-dotted h-48 rounded-lg border-dashed border-2 border-blue-700 bg-gray-400 flex justify-center items-center">
                                <div class="absolute flex flex-col items-center">
                                    <i class="fa fa-folder-open fa-4x text-gray-700"></i>
                                    <span class="pt-4 block text-gray-700 text-bold text-xl">Click to Upload</span>
                                </div>
                                <input id="fileInput" type="file"
                                    class="z-100 h-full w-full opacity-0 bg-gray-400 hover:cursor-pointer" multiple
                                    accept="application/pdf, video/mp4, video/quicktime, video/x-matroska, video/x-msvideo">

                            </div>
                        </div>
                    </div>
                </div>


                <div id="uploadedFiles" class="max-w-md mx-auto mt-4"></div>

                <br>
                <div class="flex items-center justify-between">
                    <button
                        class="bg-transparent border border-green-700 hover:bg-green-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline"
                        id='upload' type="button">
                        <i class="fa-solid fa-upload"></i>
                        Upload
                    </button>

                    <button
                        class="bg-gray-500 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline hover:cursor-not-allowed"
                        id='cancel' type="button" disabled>
                        Cancel
                    </button>
                    <button
                        class="bg-transparent border border-red-500  hover:bg-red-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline"
                        id='toggleSearch' type="button">
                        <i class="fa-solid fa-arrows-rotate"></i>
                        Go Back
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Search Results Table -->
    <div id="searchResults">
    </div>
    <!-- Loading Screen -->
    <div id="loadingScreen"
        class="z-9999 fixed top-0 left-0 w-full h-full bg-black bg-opacity-30 flex items-center justify-center hidden">
        <div class="loader ease-linear rounded-full border-4 border-t-4 border-white h-12 w-12 mb-4"></div>
    </div>
    <!-- Modal -->
    <div id="modal" class="fixed z-50 inset-0 overflow-y-auto hidden">
        <div class="bg-black bg-opacity-30 flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
            <!-- Background overlay -->
            <div class="fixed inset-0 transition-opacity" aria-hidden="true">
                <div class="absolute inset-0 bg-black opacity-70"></div>
            </div>
            <!-- Modal panel -->
            <span class="hidden sm:inline-block sm:align-middle sm:h-screen" aria-hidden="true">&#8203;</span>
            <div id='modalBorder' class="inline-block align-bottom bg-gray-900 border-2 rounded-lg px-4 pt-5 pb-4 text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-lg sm:w-full sm:p-6"
                role="dialog" aria-modal="true" aria-labelledby="modal-headline">
                <div>
                    <div id="modal-icon" class="mx-auto border-2 flex justify-center h-12 w-12 rounded-full">
                        <!-- Dynamic SVG will be inserted here -->
                    </div>
                    <div class="mt-3 text-center sm:mt-5">
                        <h3 class="text-lg leading-6 font-medium text-white-900" id="modal-headline">
                        </h3>
                        <div class="mt-2">
                            <p class="text-sm text-white-500" id="modal-message">
                            </p>
                        </div>
                    </div>
                </div>
                <div class="mt-5 sm:mt-6">
                    <button id="modal-close" type="button"
                        class="inline-flex justify-center w-full rounded-md border border-transparent shadow-sm px-4 py-2 text-base font-medium text-white  focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500 sm:text-sm">
                        Close
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="../static/modal.js"></script>
    <script src="../static/index.js"></script>
    <script src="https://kit.fontawesome.com/bbae8625e7.js" crossorigin="anonymous"></script>
</body>

</html>
